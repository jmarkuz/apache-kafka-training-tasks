spring:
  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # isolates the busiest websites on partition 0 (see WikimediaPartitioner)
        partitioner.class: edu.jmarkuz.training.partitioner.WikimediaPartitioner
        wikimedia.partitioner.hot-keys: "www.wikidata.org,commons.wikimedia.org"

    topic:
      name: "wikimedia.recentchange"
      # 3 partitions allow up to 3 consumers of one group to read in parallel
      partitions: 3
      # a single local broker can hold only 1 replica; use 3 on a multi-broker cluster (roadmap 4.2)
      replicas: 1
      # keep messages for 7 days (retention.bytes is left unlimited)
      retention-ms: 604800000
